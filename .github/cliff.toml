# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
# A Tera template to be rendered for each release in the changelog.
# See https://keats.github.io/tera/docs/#introduction
body = """
{%- macro remote_url() -%}
  https://github.com/Sumrix/FolderDB
{%- endmacro -%}

{% macro print_commit(commit) -%}
    - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
        {% if commit.breaking %}[**breaking**] {% endif %}\
        {{ commit.message | upper_first }} - \
        ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))\
{% endmacro -%}

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits
    | filter(attribute="scope")
    | sort(attribute="scope") %}
        {{ self::print_commit(commit=commit) }}
    {%- endfor %}
    {% for commit in commits %}
        {%- if not commit.scope -%}
            {{ self::print_commit(commit=commit) }}
        {% endif -%}
    {% endfor -%}
{% endfor -%}
"""
# No `github.*` in the template on purpose. Touching it switches on git-cliff's GitHub
# integration, which calls /repos/<repo>/pulls and panics on failure rather than degrading.
# The workflow declares permissions explicitly, so the token carries only the scopes named
# there and that call returned 403. Bringing back a contributors section takes three things:
# the template block, `pull-requests: read` in the job permissions, and `GITHUB_REPO` back in
# the step's env so the integration knows which repository to ask about.

# No footer. The usual `<!-- generated by git-cliff -->` is emitted for every release and
# GitHub escapes raw HTML in release bodies, so it showed up as a visible line of text.

# Remove leading and trailing whitespaces from the changelog's body.
trim = true

postprocessors = [
  # Replace the placeholder `<REPO>` with a URL.
  { pattern = '<REPO>', replace = "https://github.com/Sumrix/FolderDB" },
]

[git]
# Parse commits according to the conventional commits specification.
# See https://www.conventionalcommits.org
conventional_commits = true

# Drop commits that are not conventional. This is what hides the two "Initial commit"
# entries from the very first release.
filter_unconventional = true

split_commits = false

commit_preprocessors = [
  # Replace issue numbers with link templates to be updated in `changelog.postprocessors`.
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](<REPO>/issues/${2}))" },
]

# Group numbers are zero padded because group_by sorts the raw string: with single
# digits a tenth group would sort between "1" and "2".
commit_parsers = [
  { message = "^feat", group = "<!-- 00 -->✨ Features" },
  { message = "^fix", group = "<!-- 01 -->🐛 Bug Fixes" },
  { message = "^refactor", group = "<!-- 02 -->🚜 Refactor" },
  { message = "^perf", group = "<!-- 03 -->⚡ Performance" },
  { message = "^doc", group = "<!-- 04 -->📝 Documentation" },
  { message = "^build", group = "<!-- 05 -->🏗️ Build" },
  { message = "^test", group = "<!-- 06 -->🧪 Testing" },
  { message = "^style", group = "<!-- 07 -->🎨 Styling" },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore|^ci", group = "<!-- 08 -->⚙️ Miscellaneous Tasks" },
  { body = ".*security", group = "<!-- 09 -->🛡️ Security" },
  { message = "^revert", group = "<!-- 10 -->◀️ Revert" },
]

# Prevent commits that are breaking from being excluded by commit parsers.
protect_breaking_commits = false

# Keep commits that no parser matched, so a new type shows up instead of vanishing.
filter_commits = false

# Regex to select git tags that represent releases.
tag_pattern = "v[0-9].*"

# No skip_tags: prereleases are published like any other version, so they are real
# releases here and their commits must not roll into the next one.

topo_order = false

# Order of commits in each group/release within the changelog.
sort_commits = "newest"
